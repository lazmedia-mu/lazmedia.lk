<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon - We're Building Something Amazing</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/your-font-awesome-key.js" crossorigin="anonymous"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #020617 0%, #0f172a 50%, #1e293b 100%);
            color: white;
            overflow-x: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* Animated Background Elements */
        .bg-elements {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
        }

        .floating-shape {
            position: absolute;
            border-radius: 50%;
            background: rgba(212, 160, 23, 0.06);
            filter: blur(60px);
            animation: float 20s infinite ease-in-out;
        }

        .shape-1 {
            width: 400px;
            height: 400px;
            top: -150px;
            left: -150px;
            animation-delay: 0s;
        }

        .shape-2 {
            width: 500px;
            height: 500px;
            bottom: -200px;
            right: -200px;
            animation-delay: 7s;
        }

        .shape-3 {
            width: 300px;
            height: 300px;
            top: 40%;
            left: 60%;
            transform: translate(-50%, -50%);
            animation-delay: 4s;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            33% { transform: translateY(-30px) rotate(5deg); }
            66% { transform: translateY(20px) rotate(-5deg); }
        }

        .container {
            max-width: 900px;
            width: 90%;
            text-align: center;
            position: relative;
            z-index: 10;
            padding: 60px 20px;
        }

        /* Logo Section */
        .logo {
            margin-bottom: 40px;
        }

        .logo i {
            font-size: 4rem;
            color: #d4a017;
            animation: pulse-glow 2s infinite ease-in-out;
        }

        @keyframes pulse-glow {
            0%, 100% { 
                text-shadow: 0 0 20px rgba(212, 160, 23, 0.5);
                transform: scale(1);
            }
            50% { 
                text-shadow: 0 0 40px rgba(212, 160, 23, 0.8);
                transform: scale(1.05);
            }
        }

        /* Animated Main Message */
        .main-heading {
            font-size: 3.2rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 16px;
            background: linear-gradient(90deg, #f8fafc 0%, #d4a017 50%, #f8fafc 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shimmer 4s linear infinite;
        }

        @keyframes shimmer {
            0% { background-position: 200% center; }
            100% { background-position: -200% center; }
        }

        /* Working on it Animation */
        .working-text {
            font-size: 1.3rem;
            font-weight: 400;
            color: #94a3b8;
            margin-bottom: 48px;
            min-height: 40px;
            letter-spacing: 0.01em;
        }

        .working-text span {
            opacity: 0;
            display: inline-block;
            animation: fadeInWords 0.5s forwards;
        }

        .working-text .dots {
            display: inline-block;
            margin-left: 5px;
        }

        .working-text .dots span {
            animation: blink 1.4s infinite both;
            opacity: 0;
        }

        .working-text .dots span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .working-text .dots span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes fadeInWords {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes blink {
            0%, 80%, 100% { opacity: 0; }
            40% { opacity: 1; }
        }

        /* Progress Bar Section */
        .progress-section {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(24px);
            border-radius: 24px;
            padding: 40px;
            margin-bottom: 32px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .progress-label {
            font-size: 1.1rem;
            margin-bottom: 15px;
            color: #cbd5e1;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .progress-percent {
            color: #d4a017;
            font-weight: 700;
            font-size: 1.3rem;
        }

        .progress-bar-container {
            width: 100%;
            height: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #d4a017, #f59e0b, #d4a017);
            background-size: 200% auto;
            border-radius: 10px;
            transition: width 1s ease-out;
            animation: gradient-move 2s linear infinite;
            position: relative;
        }

        .progress-bar::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            animation: shine 1.5s infinite;
        }

        @keyframes gradient-move {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        @keyframes shine {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        /* Countdown Timer Section */
        .countdown-section {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(24px);
            border-radius: 24px;
            padding: 40px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .countdown-title {
            font-size: 1.2rem;
            margin-bottom: 25px;
            color: #cbd5e1;
        }

        .countdown-title i {
            color: #d4a017;
            margin-right: 10px;
        }

        .countdown-timer {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 20px;
            max-width: 600px;
            margin: 0 auto;
        }

        .time-unit {
            background: rgba(30, 41, 59, 0.6);
            border-radius: 16px;
            padding: 24px 16px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .time-unit:hover {
            transform: translateY(-4px);
            border-color: rgba(212, 160, 23, 0.4);
            box-shadow: 0 20px 40px -10px rgba(212, 160, 23, 0.15);
        }

        .time-number {
            font-size: 2.8rem;
            font-weight: 700;
            color: #d4a017;
            display: block;
            line-height: 1;
            margin-bottom: 10px;
            font-variant-numeric: tabular-nums;
        }

        .time-label {
            font-size: 0.75rem;
            font-weight: 500;
            text-transform: uppercase;
            color: #64748b;
            letter-spacing: 1.5px;
        }

        /* Social Links */
        .social-links {
            margin-top: 40px;
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .social-link {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(15, 23, 42, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #94a3b8;
            text-decoration: none;
            font-size: 1.2rem;
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .social-link:hover {
            background: #d4a017;
            color: #0f172a;
            transform: translateY(-4px);
            box-shadow: 0 20px 25px -5px rgba(212, 160, 23, 0.25);
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .container {
                padding: 40px 16px;
            }
            
            .main-heading {
                font-size: 2.2rem;
            }
            
            .working-text {
                font-size: 1.15rem;
                margin-bottom: 36px;
            }
            
            .time-number {
                font-size: 2.4rem;
            }
            
            .progress-section, .countdown-section {
                padding: 32px 24px;
                margin-bottom: 24px;
            }
            
            .logo i {
                font-size: 3rem;
            }
        }

        @media (max-width: 480px) {
            .main-heading {
                font-size: 1.8rem;
            }
            
            .countdown-timer {
                grid-template-columns: repeat(2, 1fr);
                gap: 16px;
            }
            
            .time-unit {
                padding: 20px 12px;
            }
            
            .social-links {
                gap: 16px;
                margin-top: 32px;
            }
        }
    </style>
</head>
<body>
    <div class="bg-elements">
        <div class="floating-shape shape-1"></div>
        <div class="floating-shape shape-2"></div>
        <div class="floating-shape shape-3"></div>
    </div>

    <div class="container">
        <div class="logo">
            <i class="fas fa-cross"></i>
        </div>

        <h1 class="main-heading">Oops! Site is not yet available</h1>
        
        <p class="working-text">
            <span id="message-text"></span>
            <span class="dots"><span>.</span><span>.</span><span>.</span></span>
        </p>

        <!-- Progress Bar Section -->
        <div class="progress-section">
            <div class="progress-label">
                <span>Development in Progress</span>
                <span class="progress-percent" id="progressPercent">0%</span>
            </div>
            <div class="progress-bar-container">
                <div class="progress-bar" id="progressBar"></div>
            </div>
        </div>

        <!-- Countdown Section -->
        <div class="countdown-section">
            <h3 class="countdown-title">
                <i class="fas fa-clock"></i>
                Estimated Launch: <span id="launch-date">December 31, 2025</span>
            </h3>
            <div class="countdown-timer">
                <div class="time-unit">
                    <span class="time-number" id="days">00</span>
                    <span class="time-label">Days</span>
                </div>
                <div class="time-unit">
                    <span class="time-number" id="hours">00</span>
                    <span class="time-label">Hours</span>
                </div>
                <div class="time-unit">
                    <span class="time-number" id="minutes">00</span>
                    <span="time-label">Minutes</span>
                </div>
                <div class="time-unit">
                    <span class="time-number" id="seconds">00</span>
                    <span class="time-label">Seconds</span>
                </div>
            </div>
        </div>

        <!-- Social Links 
        <div class="social-links">
            <a href="#" class="social-link" title="Facebook">
                <i class="fab fa-facebook-f"></i>
            </a>
            <a href="#" class="social-link" title="Instagram">
                <i class="fab fa-instagram"></i>
            </a>
            <a href="#" class="social-link" title="Youtube">
                <i class="fab fa-youtube"></i>
            </a>
            <a href="#" class="social-link" title="Email">
                <i class="fas fa-envelope"></i>
            </a>
        </div>-->
    </div>

    <script>
        // 1. "We're working on it" message animation
        const message = "#we're working on it";
        const messageElement = document.getElementById('message-text');
        let charIndex = 0;

        function typeMessage() {
            if (charIndex < message.length) {
                const span = document.createElement('span');
                span.textContent = message[charIndex];
                span.style.animationDelay = `${charIndex * 0.08}s`;
                messageElement.appendChild(span);
                charIndex++;
                setTimeout(typeMessage, 80);
            }
        }

        // Start typing animation on page load
        setTimeout(typeMessage, 500);

        // 2. Progress Bar - YOU CAN SET THIS VALUE MANUALLY (0-100)
        function updateProgressBar(targetValue) {
            const progressBar = document.getElementById('progressBar');
            const progressPercent = document.getElementById('progressPercent');
            
            setTimeout(() => {
                progressBar.style.width = `${targetValue}%`;
                progressPercent.textContent = `${targetValue}%`;
            }, 800);
        }

        // **************************
        // SET YOUR PROGRESS HERE:
        // **************************
        const progressValue = 12; // <-- CHANGE THIS TO YOUR DESIRED PROGRESS %
        updateProgressBar(progressValue);

        // 3. Countdown Timer
        // **************************
        // SET YOUR LAUNCH DATE HERE:
        // **************************
        const launchDate = new Date('2026-12-31T00:00:00').getTime(); // <-- CHANGE THIS DATE

        function updateCountdown() {
            const now = new Date().getTime();
            const distance = launchDate - now;

            if (distance > 0) {
                const days = Math.floor(distance / (1000 * 60 * 60 * 24));
                const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((distance % (1000 * 60)) / 1000);

                document.getElementById('days').textContent = String(days).padStart(2, '0');
                document.getElementById('hours').textContent = String(hours).padStart(2, '0');
                document.getElementById('minutes').textContent = String(minutes).padStart(2, '0');
                document.getElementById('seconds').textContent = String(seconds).padStart(2, '0');
            } else {
                document.getElementById('days').textContent = '00';
                document.getElementById('hours').textContent = '00';
                document.getElementById('minutes').textContent = '00';
                document.getElementById('seconds').textContent = '00';
            }
        }

        // Update countdown every second
        setInterval(updateCountdown, 1000);
        updateCountdown(); // Initial call
    </script>
</body>
</html>
